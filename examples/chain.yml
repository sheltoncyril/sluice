# .github/chain.yml — lives in the MIDSTREAM repo's default branch.
# sluice reads it at runtime through the GitHub API; nothing is cached or stored.
version: 1

# upstream is third-party: public, read-only, the app is NOT installed there.
upstream:
  repo: acme-oss/widget
  branch: main
midstream:
  repo: my-org/widget
  branch: main
downstream:
  repo: my-other-org/widget-deploy
  branch: main

# "fork": midstream is a fork of upstream, downstream is a fork of midstream, so sync branches can
# point straight at the source commit. "git-data" (unrelated repos) is planned, not built yet.
transport: fork

hops:
  upstream_to_midstream:
    # How YOU merge the sync PR. "merge" keeps upstream history, so "behind?" is plain ancestry.
    # "squash"/"rebase" also work: the app then remembers which upstream commit each merged
    # sync PR carried (a marker in the PR body) instead of relying on ancestry.
    merge_method: merge
    poll_interval_minutes: 60 # can only slow the hourly cron down, never speed it up
    sync_branch: chain/sync-upstream
    # Midstream-only files that upstream changes must not overwrite (picomatch globs; dot-files match).
    # Even when upstream edits the same file, midstream's version wins and there is no conflict.
    protected_paths:
      - "patches/**"
      - "MIDSTREAM.md"
      - ".github/workflows/midstream-*.yml"
  midstream_to_downstream:
    merge_method: merge
    sync_branch: chain/sync-midstream
    protected_paths: []

pull_requests:
  labels: [sluice]
  assignees: [octocat]
  reviewers: [octocat]
  team_reviewers: []
  draft: false

conflicts:
  label: sluice/conflict
  comment: true
  assignees: [octocat] # defaults to pull_requests.reviewers when empty
  request_review: true

# --- workflow templates, variables and secrets ----------------------------------------------------
workflows:
  templates_path: templates # in the midstream repo; see examples/templates/ci.yml
  branch: chain/workflows   # bot branch in each target; PRs open from it
  # Available in templates as {{ node_version }}. Built-ins (do not redefine): repo, owner, name,
  # branch, role, upstream_repo, midstream_repo, downstream_repo. ${{ ... }} is left untouched.
  values:
    node_version: "22"
  files:
    - template: ci.yml                      # templates/ci.yml
      destination: .github/workflows/ci.yml # must be directly under .github/workflows/
      targets: [midstream, downstream]
  # Managed destinations are protected automatically on the sync hops, so upstream's (or midstream's)
  # copy of the same file can never overwrite what sluice renders.

variables: # non-sensitive; applied straight from this file
  - name: DEPLOY_REGION
    value: eu-west-1
    targets: [downstream]

secrets: # NAMES ONLY. Values are submitted once via the authenticated endpoint, never stored.
  - name: NPM_TOKEN
    targets: [midstream, downstream]
    max_age_days: 90 # optional rotation policy: the daily reconcile reports it once it is older

# The scheduled reconcile (all optional; these are the defaults).
reconcile:
  enabled: true
  interval_hours: 24
  report: issue # one self-updating issue in midstream (needs Issues: write); "none" = run log only.
                # The same issue reports this file if it ever stops validating; "none" opts out of that too.
  issue_label: sluice/drift
  stale_pr_days: 14 # an open sync PR older than this is reported
